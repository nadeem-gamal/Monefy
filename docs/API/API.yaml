      operationId: getUserByName
      parameters:
        - name: username
          in: path
          description: 'The name that needs to be fetched. Use user1 for testing. '
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'          
        '400':
          description: Invalid username supplied
        '404':
          description: User not found
    put:
      tags:
        - user
      summary: Update user
      description: This can only be done by the logged in user.
      operationId: updateUser
      parameters:
        - name: username
          in: path
          description: name that need to be updated
          required: true
          schema:
            type: string
      requestBody:
        description: Update an existent user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        default:
          description: successful operation
  
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: Bills
        image:
          type: string
          example: car
        type:
          type: boolean
          description: 'True: Income, False: Expense'
          example: true
    Currency:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 10
        name:
          type: string
          example: Egyptian Pound
        symbol:
          type: string
          example: EGP
        # image:
        #   type: string
        #   example: cash
    Account:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 100000
        name:
          type: string
          example: Cash
        currency:
          $ref: '#/components/schemas/Currency'
        image:
          type: string
          example: car
        initial_account_balance:
          type: number
          format: float
        initial_balance_date:
          type: string
          format: date
        enabled:
          type: boolean
        balance:
          type: number
          format: float
    Transaction:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        account_id:
          type: integer
          format: int32
          description: ID of the account this transaction belongs to
          example: 100000
        date:
          type: string
          format: date
        category:
          type: string
        amount:
          type: number
          format: float
        description:
          type: string
        transaction_type:
          type: boolean
          description: 'True: Transaction, False: Transfer'
          example: true
    User:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 10
        username:
          type: string
          example: theUser
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: James
        email:
          type: string
          example: john@email.com
        password:
          type: string
          example: '12345'
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
  requestBodies:
    Category:
      description: Category object that needs to be added
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Category'
    UserArray:
      description: List of user object
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
  securitySchemes:
    monefy_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://localhost/oauth/authorize
          scopes:
            write:categories: modify categories
            read:categories: read categories
            write:currencies: modify currencies
            read:currencies: read currencies
            write:accounts: modify accounts
            read:accounts: read accounts
            write:transactions: modify transactions
            read:transactions: read transactions
            write:users: modify user profile
            read:users: read user profile
    api_key:
      type: apiKey
      name: api_key
      in: header