openapi: 3.0.3
info:
  title: Monefy API - OpenAPI 3.0
  description: |-
    Monefy is a personal finance management application that helps users track their income, expenses, and account balances across multiple currencies.
    
    This API provides comprehensive endpoints for managing:
    - User accounts and authentication
    - Financial accounts with multi-currency support
    - Transaction tracking (expenses and income)
    - Expense categories and currency management
    
    Some useful links:
    - [The Monefy repository](https://github.com/nadeem-gamal/Monefy)
    - [The source API definition for the Monefy](https://github.com/nadeem-gamal/Monefy/blob/master/docs/API/API.yaml)
  termsOfService: https://github.com/nadeem-gamal/Monefy/blob/master/README.md
  contact:
    email: support@monefy.app
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.11
externalDocs:
  description: Find out more about Monefy
  url: https://github.com/nadeem-gamal/Monefy
servers:
  - url: https://localhost/api/v3
tags:
  - name: category
    description: Operations about category
  - name: currency
    description: Operations about currency
  - name: transaction
    description: Operations about transaction
  - name: account
    description: Access to accounts
  - name: user
    description: Operations about user
paths:
  /category:
    put:
      tags:
        - category
      summary: Update an existing category
      description: Update an existing category by Id
      operationId: updateCategory
      requestBody:
        description: Update an existent category
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'          
        '400':
          description: Invalid ID supplied
        '404':
          description: Category not found
        '405':
          description: Validation exception
      security:
        - monefy_auth:
            - write:categories
            - read:categories
    post:
      tags:
        - category
      summary: Add a new category
      description: Add a new category
      operationId: addCategory
      requestBody:
        description: Create a new category
        content:
